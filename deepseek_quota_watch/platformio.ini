; ============================================================
; M5Stack StopWatch (C152, ESP32-S3R8) — DeepSeek 余额/用量手表
; 官方 PlatformIO 配置参考: http://docs.m5stack.com/zh_CN/core/StopWatch
; 烧录: pio run -t upload        (端口自动; 或加 --upload-port COM7)
; 串口: pio device monitor       (115200)
; ============================================================

[platformio]
default_envs = m5stack-stopwatch

[env:m5stack-stopwatch]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino

; ---- Flash / 分区 ----
board_build.partitions = partitions.csv
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200

build_flags =
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

lib_deps =
  https://github.com/m5stack/M5Unified
  https://github.com/m5stack/M5GFX
  https://github.com/m5stack/M5PM1
  https://github.com/m5stack/M5IOE1
  bblanchon/ArduinoJson@^7.0.4

; ---- 可选：固定串口 ----
; upload_port = COM7
